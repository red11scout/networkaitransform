<!DOCTYPE html>
<html lang="en">
<head>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      
      .slide-container {
        width: 1280px;
        min-height: 720px;
        background: #FFFFFF;
        font-family: Verdana, sans-serif;
        position: relative;
        overflow: hidden;
      }
      
      .header-bar {
        width: 100%;
        height: 80px;
        background: #001177;
        display: flex;
        align-items: center;
        padding-left: 60px;
      }
      
      .logo {
        font-family: Consolas, monospace;
        font-size: 32px;
        font-weight: bold;
        color: #FFFFFF;
        letter-spacing: 2px;
      }
      
      .logo-accent {
        color: #04A1FE;
      }
      
      .content-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 560px;
        padding-top: 80px;
      }
      
      .main-title {
        font-family: Consolas, monospace;
        font-size: 56px;
        font-weight: bold;
        color: #001177;
        text-align: center;
        margin-bottom: 30px;
        line-height: 1.2;
      }
      
      .subtitle {
        font-family: Verdana, sans-serif;
        font-size: 28px;
        color: #040822;
        text-align: center;
        margin-bottom: 60px;
      }
      
      .accent-line {
        width: 400px;
        height: 4px;
        background: linear-gradient(90deg, #04A1FE 0%, #32BF78 100%);
        margin-bottom: 40px;
      }
      
      .footer {
        position: absolute;
        bottom: 40px;
        width: 100%;
        text-align: center;
        font-family: Verdana, sans-serif;
        font-size: 14px;
        color: #C8C8C8;
      }
      
      .geometric-accent {
        position: absolute;
        bottom: 0;
        right: 0;
        width: 300px;
        height: 300px;
        opacity: 0.05;
      }
      
      .geometric-accent circle {
        fill: #04A1FE;
      }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header-bar">
            <div class="logo">BLUE<span class="logo-accent">ALLY</span></div>
        </div>
        
        <div class="content-area">
            <div class="main-title">
                Verizon AI Transformation
            </div>
            <div class="accent-line"></div>
            <div class="subtitle">
                Financial Impact & Implementation Roadmap
            </div>
        </div>
        
        <div class="footer">
            BlueAlly Strategic Analysis | Confidential | December 2025
        </div>
        
        <svg class="geometric-accent" viewBox="0 0 300 300">
            <circle cx="150" cy="150" r="120" />
            <circle cx="200" cy="100" r="80" />
            <circle cx="100" cy="200" r="60" />
        </svg>
    </div>
</body>
</html>
