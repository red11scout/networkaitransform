<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      .slide-container { width: 1280px; min-height: 720px; background: #FFFFFF; font-family: Verdana, sans-serif; }
      .header-bar { width: 100%; height: 60px; background: #001177; display: flex; align-items: center; justify-content: space-between; padding-left: 60px; padding-right: 60px; }
      .logo { font-family: Consolas, monospace; font-size: 24px; font-weight: bold; color: #FFFFFF; }
      .logo-accent { color: #04A1FE; }
      .slide-number { font-family: Verdana, sans-serif; font-size: 14px; color: #CEE5F1; }
      .content { padding-left: 60px; padding-right: 60px; padding-top: 40px; }
      .slide-title { font-family: Consolas, monospace; font-size: 32px; font-weight: bold; color: #001177; margin-bottom: 40px; }
      .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 35px; }
      .summary-card { background: #F8F9FA; padding: 14px 16px; text-align: center; }
      .summary-value { font-family: Consolas, monospace; font-size: 36px; font-weight: bold; color: #001177; margin-bottom: 8px; }
      .summary-label { font-family: Verdana, sans-serif; font-size: 14px; color: #666666; }
      /* Reduced chart height so content fits under 720px */
      .chart-container { height: 380px; }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header-bar">
            <div class="logo">BLUE<span class="logo-accent">ALLY</span></div>
            <div class="slide-number">Slide 10 of 20</div>
        </div>
        
        <div class="content">
            <div class="slide-title">14 Measurable KPI Improvements Across All Initiatives</div>
            
            <div class="summary-grid">
                <div class="summary-card">
                    <div class="summary-value">14</div>
                    <div class="summary-label">Total KPIs</div>
                </div>
                <div class="summary-card">
                    <div class="summary-value">5</div>
                    <div class="summary-label">Horizon 1</div>
                </div>
                <div class="summary-card">
                    <div class="summary-value">5</div>
                    <div class="summary-label">Horizon 2</div>
                </div>
                <div class="summary-card">
                    <div class="summary-value">4</div>
                    <div class="summary-label">H3 + Enablers</div>
                </div>
            </div>
            
            <div class="chart-container">
                <canvas id="kpiChart"></canvas>
            </div>
        </div>
    </div>
    
    <script>
        const ctx = document.getElementById('kpiChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: [
                    'Real-Time Anomaly Detection',
                    'Post-Maintenance Documentation',
                    'Knowledge Base Auto-Generation',
                    'Autonomous Network Testing',
                    'Automated Root Cause Analysis',
                    'Intelligent Incident Triage',
                    'Network Configuration Optimization',
                    'Self-Healing Network Systems',
                    'Customer Impact Prediction',
                    'Predictive Maintenance Scheduling'
                ],
                datasets: [{
                    label: 'KPI Improvement (%)',
                    data: [94, 90, 85, 80, 75, 70, 60, 60, 50, 40],
                    backgroundColor: '#04A1FE',
                    borderWidth: 0
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        beginAtZero: true,
                        max: 100,
                        title: {
                            display: true,
                            text: 'Improvement Percentage (%)',
                            font: { family: 'Verdana', size: 14 },
                            color: '#333333'
                        },
                        ticks: {
                            font: { family: 'Verdana', size: 13 },
                            color: '#666666',
                            callback: function(value) {
                                return value + '%';
                            }
                        },
                        grid: { color: '#E0E0E0' }
                    },
                    y: {
                        ticks: {
                            font: { family: 'Verdana', size: 12 },
                            color: '#333333'
                        },
                        grid: { display: false }
                    }
                },
                plugins: {
                    legend: { display: false },
                    title: {
                        display: true,
                        text: 'Top 10 KPI Improvements by Percentage',
                        font: { family: 'Consolas', size: 20, weight: 'bold' },
                        color: '#001177',
                        padding: { bottom: 20 }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return 'Improvement: ' + context.parsed.x + '%';
                            }
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
